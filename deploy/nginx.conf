# Шаблон конфигурации nginx как reverse proxy перед Node-процессом.
# Сам Node слушает голый HTTP на 127.0.0.1:PORT — наружу смотрит только nginx.
#
# Установка (Ubuntu/Debian):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/dash
#   # заменить example.com на реальный домен клиента
#   sudo ln -s /etc/nginx/sites-available/dash /etc/nginx/sites-enabled/dash
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS добавляется ПОСЛЕ этого шага командой certbot — она сама допишет
# сюда серверный блок на 443 и редирект с 80 на 443, руками сертификаты
# прописывать не нужно:
#   sudo certbot --nginx -d example.com
#
# Подробный порядок шагов — DEPLOY.md.

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # Тело запроса ограничено самим приложением (MAX_REQUEST_BODY_BYTES,
    # дефолт 1 МБ) — здесь чуть с запасом, чтобы nginx не резал раньше него.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Выгрузка XLSX на большом снимке и синхронизация с Битриксом могут
        # занять больше стандартных 60с nginx — не режем на полпути.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # /health и /ready — быстрые проверки без похода в расчётный модуль,
    # держим их с тем же timeout по умолчанию.
    location = /health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    gzip on;
    gzip_types application/json text/css application/javascript text/javascript;
    gzip_min_length 512;
}
