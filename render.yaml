services:
  - type: web
    name: dash-funnel-demo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATA_SOURCE
        value: demo
      - key: PORTAL_TIMEZONE
        value: Europe/Moscow
      # Бесплатный веб-сервис Render всегда за HTTPS, поэтому Secure-флаг
      # включаем сразу — на VPS (DEPLOY.md) это делается только после certbot.
      - key: COOKIE_SECURE
        value: "1"
      # sync: false — значения задаются руками в Render Dashboard (Environment),
      # НЕ хранятся в этом файле: он лежит в публичном репозитории, а это пароль.
      # Смысл — на эфемерном диске data/users.json стирается при каждом
      # пересоздании контейнера; без этого экран первого запуска всплывал бы
      # заново после каждого сна/редеплоя (см. ensureBootstrapAdmin в userStore.js).
      - key: BOOTSTRAP_ADMIN_LOGIN
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
